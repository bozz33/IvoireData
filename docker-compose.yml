# IvoireData v0.8.9 — déploiement local CI Gold avec synchronisation upstream incrémentale.
# Les données, overrides, cache upstream, Artifact Ledger et qualification restent sur la machine hôte.
# Le pipeline corpus/tokenizer reste downstream.

x-engine-env: &engine-env
  IVOIREDATA_DATA_DIR: /app/data_lake
  IVOIREDATA_STATE_DIR: /app/.ivoiredata/state
  IVOIREDATA_DATASET_NAME: ${IVOIREDATA_DATASET_NAME:-ivoiredata}
  IVOIREDATA_PIPELINE_NAME: ${IVOIREDATA_PIPELINE_NAME:-ivoiredata_engine}
  IVOIREDATA_SCHEDULER_INTERVAL: ${IVOIREDATA_SCHEDULER_INTERVAL:-}
  # Optional read-only GitHub credentials. When configured, official Git documentation
  # bodies use the authenticated Git Blob REST endpoint instead of raw.githubusercontent.com.
  GITHUB_TOKEN: ${GITHUB_TOKEN:-}
  GH_TOKEN: ${GH_TOKEN:-}
  # Industrial technology orchestrator. The worker is opt-in through the `technology`
  # compose profile; these values only bound each cycle and never trigger a registry bootstrap.
  IVOIREDATA_TECH_ORCHESTRATOR_INTERVAL: ${IVOIREDATA_TECH_ORCHESTRATOR_INTERVAL:-900}
  IVOIREDATA_TECH_QUALIFICATION_BUDGET: ${IVOIREDATA_TECH_QUALIFICATION_BUDGET:-90}
  IVOIREDATA_TECH_AUTHORITY_BUDGET: ${IVOIREDATA_TECH_AUTHORITY_BUDGET:-36}
  IVOIREDATA_TECH_TARGET_BUDGET: ${IVOIREDATA_TECH_TARGET_BUDGET:-180}
  IVOIREDATA_TECH_DISCOVERY_BUDGET: ${IVOIREDATA_TECH_DISCOVERY_BUDGET:-18}
  IVOIREDATA_TECH_FETCH_BUDGET: ${IVOIREDATA_TECH_FETCH_BUDGET:-9}
  IVOIREDATA_TECH_QUALIFICATION_QUANTUM: ${IVOIREDATA_TECH_QUALIFICATION_QUANTUM:-10}
  IVOIREDATA_TECH_AUTHORITY_QUANTUM: ${IVOIREDATA_TECH_AUTHORITY_QUANTUM:-4}
  IVOIREDATA_TECH_TARGET_QUANTUM: ${IVOIREDATA_TECH_TARGET_QUANTUM:-20}
  IVOIREDATA_TECH_DISCOVERY_QUANTUM: ${IVOIREDATA_TECH_DISCOVERY_QUANTUM:-2}
  IVOIREDATA_TECH_FETCH_QUANTUM: ${IVOIREDATA_TECH_FETCH_QUANTUM:-1}
  # Dynamic documentation-specific safety. A source-lock conflict must never look like
  # a 6-hour network hang, and one target cannot hold an industrial cycle forever.
  IVOIREDATA_TECH_FETCH_LOCK_TIMEOUT: ${IVOIREDATA_TECH_FETCH_LOCK_TIMEOUT:-120}
  IVOIREDATA_TECH_FETCH_TARGET_TIMEOUT: ${IVOIREDATA_TECH_FETCH_TARGET_TIMEOUT:-900}
  # Official web documentation transport. Requests uses separate connect/read socket
  # inactivity timeouts; the target watchdog remains the independent wall-clock guard.
  IVOIREDATA_DOCS_CONNECT_TIMEOUT: ${IVOIREDATA_DOCS_CONNECT_TIMEOUT:-6.1}
  IVOIREDATA_DOCS_READ_TIMEOUT: ${IVOIREDATA_DOCS_READ_TIMEOUT:-30}
  IVOIREDATA_DOCS_DEADLINE_RESERVE: ${IVOIREDATA_DOCS_DEADLINE_RESERVE:-10}

x-engine-volumes: &engine-volumes
  - ./data_lake:/app/data_lake
  - ./.ivoiredata:/app/.ivoiredata

services:
  init-volumes:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        mkdir -p /data/data_lake /data/.ivoiredata/state
        chown -R ${PUID:-1000}:${PGID:-1000} /data/data_lake /data/.ivoiredata
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes: *engine-volumes

  api:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: ivoiredata:0.8.9
    restart: unless-stopped
    environment: *engine-env
    volumes: *engine-volumes
    ports:
      - "${IVOIREDATA_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: ivoiredata:0.8.9
    restart: unless-stopped
    profiles: ["run"]
    command: ["ivoiredata", "scheduler"]
    environment: *engine-env
    volumes: *engine-volumes
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  technology-scheduler:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: ivoiredata:0.8.9
    restart: unless-stopped
    profiles: ["technology"]
    command: ["ivoiredata-tech-orchestrator", "loop"]
    environment: *engine-env
    volumes: *engine-volumes
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  sync-once:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: ivoiredata:0.8.9
    profiles: ["sync"]
    command: ["ivoiredata", "scheduler", "--once"]
    environment: *engine-env
    volumes: *engine-volumes
    depends_on:
      init-volumes:
        condition: service_completed_successfully
