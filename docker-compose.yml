services:
  api:
    build: .
    environment: &engine_env
      IVOIREDATA_DATA_DIR: /app/data_lake
      IVOIREDATA_STATE_DIR: /app/.ivoiredata/state
    volumes:
      - ./data_lake:/app/data_lake
      - ./.ivoiredata:/app/.ivoiredata
      - ./corpora:/app/corpora
      - ./tokenizer:/app/tokenizer
    ports:
      - "8000:8000"

  scheduler:
    build: .
    command: ["ivoiredata", "scheduler", "--interval", "3600"]
    environment:
      <<: *engine_env
    volumes:
      - ./data_lake:/app/data_lake
      - ./.ivoiredata:/app/.ivoiredata
      - ./corpora:/app/corpora
      - ./tokenizer:/app/tokenizer
