# IvoireData v0.7.2 — déploiement local de production.
# Les données et l'état restent sur la machine hôte.
# IvoireData ne monte plus corpus/tokenizer : ces artefacts appartiennent au pipeline downstream.

x-engine-env: &engine-env
  IVOIREDATA_DATA_DIR: /app/data_lake
  IVOIREDATA_STATE_DIR: /app/.ivoiredata/state
  IVOIREDATA_DATASET_NAME: ${IVOIREDATA_DATASET_NAME:-ivoiredata}
  IVOIREDATA_PIPELINE_NAME: ${IVOIREDATA_PIPELINE_NAME:-ivoiredata_engine}
  IVOIREDATA_SCHEDULER_INTERVAL: ${IVOIREDATA_SCHEDULER_INTERVAL:-}

x-engine-volumes: &engine-volumes
  - ./data_lake:/app/data_lake
  - ./.ivoiredata:/app/.ivoiredata

services:
  init-volumes:
    image: alpine:3.20
    command:
      - sh
      - -c
      - |
        mkdir -p /data/data_lake /data/.ivoiredata/state
        chown -R ${PUID:-1000}:${PGID:-1000} /data/data_lake /data/.ivoiredata
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes: *engine-volumes

  api:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: ivoiredata:0.7.2
    restart: unless-stopped
    environment: *engine-env
    volumes: *engine-volumes
    ports:
      - "${IVOIREDATA_API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      init-volumes:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: ivoiredata:0.7.2
    restart: unless-stopped
    profiles: ["run"]
    command: ["ivoiredata", "scheduler"]
    environment: *engine-env
    volumes: *engine-volumes
    depends_on:
      init-volumes:
        condition: service_completed_successfully
      api:
        condition: service_healthy

  sync-once:
    build:
      context: .
      args:
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: ivoiredata:0.7.2
    profiles: ["sync"]
    command: ["ivoiredata", "scheduler", "--once"]
    environment: *engine-env
    volumes: *engine-volumes
    depends_on:
      init-volumes:
        condition: service_completed_successfully
