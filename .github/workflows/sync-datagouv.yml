name: sync data.gouv.ci
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Force refresh even when dlt state says unchanged
        type: boolean
        default: false
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      IVOIREDATA_BUCKET_URL: ${{ secrets.IVOIREDATA_BUCKET_URL }}
      IVOIREDATA_S3_ENDPOINT: ${{ secrets.IVOIREDATA_S3_ENDPOINT }}
      IVOIREDATA_S3_ACCESS_KEY: ${{ secrets.IVOIREDATA_S3_ACCESS_KEY }}
      IVOIREDATA_S3_SECRET_KEY: ${{ secrets.IVOIREDATA_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install .
      - name: Sync
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then ivoiredata sync civ_datagouv_catalog --force; else ivoiredata sync civ_datagouv_catalog; fi
      - name: Upload local fallback
        if: ${{ env.IVOIREDATA_BUCKET_URL == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ivoiredata-datagouv-${{ github.run_id }}
          path: data_lake
          if-no-files-found: warn
          retention-days: 7
