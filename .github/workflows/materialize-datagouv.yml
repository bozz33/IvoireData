name: Materialize data.gouv.ci

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre de datasets (0 = tous)"
        required: false
        default: "0"
      include_raw:
        description: "Inclure les CSV bruts dans l'artifact"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install materialization dependencies
        run: python -m pip install -e '.[materialize]'
      - name: Materialize catalog and data
        run: |
          python scripts/materialize_data_gouv_ci.py \
            --output data_lake \
            --limit "${{ inputs.limit }}"
      - name: Remove raw CSV when not requested
        if: ${{ !inputs.include_raw }}
        run: rm -rf data_lake/raw
      - name: Print snapshot summary
        run: cat data_lake/manifests/data_gouv_ci_summary.json
      - name: Upload IvoireData data.gouv.ci snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ivoiredata-datagouv-${{ github.run_id }}
          path: data_lake/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
