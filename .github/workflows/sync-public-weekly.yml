name: sync public sources
on:
  schedule:
    - cron: '41 2 * * 0'
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      IVOIREDATA_BUCKET_URL: ${{ secrets.IVOIREDATA_BUCKET_URL }}
      IVOIREDATA_S3_ENDPOINT: ${{ secrets.IVOIREDATA_S3_ENDPOINT }}
      IVOIREDATA_S3_ACCESS_KEY: ${{ secrets.IVOIREDATA_S3_ACCESS_KEY }}
      IVOIREDATA_S3_SECRET_KEY: ${{ secrets.IVOIREDATA_S3_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install .
      - run: ivoiredata sync --due --all-public
      - name: Upload local fallback
        if: ${{ env.IVOIREDATA_BUCKET_URL == '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ivoiredata-public-${{ github.run_id }}
          path: data_lake
          if-no-files-found: warn
          retention-days: 7
