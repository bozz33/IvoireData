name: validate
on: [push, pull_request, workflow_dispatch]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e '.[dev]'
      - run: python scripts/validate_registry.py
      - run: python scripts/validate_runtime_config.py
      - run: python scripts/validate_seed_facts.py
      - run: python -m compileall -q src scripts
      - run: pytest -q
      - run: ivoiredata --help
      - run: ivoiredata programming-docs languages
      - run: ivoiredata programming-docs audit
