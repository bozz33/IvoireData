[project]
name = "ivoiredata"
version = "0.3.0"
description = "Côte d’Ivoire multisector public-data materialization, RAG and provenance tooling"
requires-python = ">=3.10"

[project.optional-dependencies]
ingest = ["pypdf>=5.0"]
materialize = ["pandas>=2.2", "pyarrow>=17.0"]
dev = ["pytest>=8.0"]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
testpaths = ["tests"]
