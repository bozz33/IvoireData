[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ivoiredata"
version = "0.8.3"
description = "Local-first Côte d'Ivoire source collection, CI Gold qualification and domain-organized data delivery engine built on dlt"
requires-python = ">=3.10"
dependencies = [
  "dlt[filesystem]>=1.29,<2",
  "requests>=2.32",
  "pypdf>=5.0",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pandas>=2.2",
  "pyarrow>=17.0",
  "openpyxl>=3.1",
  "xlrd>=2.0"
]
[project.optional-dependencies]
dev = ["pytest>=8.0"]
[project.scripts]
ivoiredata = "ivoiredata.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
